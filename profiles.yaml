profiles:
  Xelsis:
    input_type: pdf
    input_file: data/Xelsis.pdf
    pages: 5, 7-8, 14-16, 18-21, 28-30
    pdf_chunk_size: 1000
    chunk_overlap: 100
    force_rebuild: false
    output_prefix: xelsis
    questions:
    - What are the possible causes of watery coffee and the remedy for each cause?
    - What maintenance does the brew group need, and how often?
    - When should I replace and activate the AquaClean filter?
    - Why does coffee come out slowly, and what should I check?
    llm:
      provider: qwen
      extraction_model: Qwen3.8-27B
      query_model: Qwen3.8-27B
      qwen_base_url: http://192.168.10.45:4000/v1
      num_workers: 2
      max_paths_per_chunk: 20
      max_cluster_size: 10
      request_timeout: 180.0
      request_max_retries: 5

  AI news:
    input_type: pdf
    input_file: data/ai_news.pdf
    pages: null
    pdf_chunk_size: 1000
    chunk_overlap: 100
    force_rebuild: false
    output_prefix: ai_news
    questions:
    - What are the main legal arguments around AI copyright and training data?
    - Which companies are involved in AI copyright disputes, and what are their positions?
    - How are different governments approaching AI governance?
    - What is the role of fair use in AI copyright disputes?
    llm:
      provider: qwen
      extraction_model: Qwen3.8-27B
      query_model: Qwen3.8-27B
      qwen_base_url: http://192.168.10.45:4000/v1
      num_workers: 2
      max_paths_per_chunk: 20
      max_cluster_size: 10
      request_timeout: 180.0
      request_max_retries: 5

  Half_PSD:
    input_type: pdf
    input_file: data/152E-GEN-8002(doc)-C.pdf
    section_ranges:
    - - 5 System Overview
      - 6 System and Sub-System operation Description
    - - 6.2.1 Door Control Unit (DCU)
      - 6.2.2 Operator Control
    - - 7.3.3 Initialization of DCU
      - 7.4 NORMAL OPERATION
    - - 12.1 CM01 – REPLACE DCU
      - 12.2 CM02 – RESET DCU
    - - 12.2 CM02 – RESET DCU
      - 12.3 CM03 – RESET PLC IN PSCC

    # Slightly smaller chunks reduce the chance that unrelated procedures/fault cases
    # are extracted into the same LLM call. The increased overlap protects relations
    # that cross sentence/chunk boundaries.
    pdf_chunk_size: 800
    chunk_overlap: 120
    force_rebuild: false
    output_prefix: half_psd
    questions:
    - What components, systems, signals, and parameters interact with the Door Control Unit?
    - What conditions and observations are associated with abnormal DCU or doorway behaviour?
    - What steps and preconditions are required to initialize, reset, or replace the Door Control Unit?
    - Which relationships in the graph are causal, diagnostic, control, monitoring, or procedural relationships?
    llm:
      provider: qwen
      extraction_model: Qwen3.8-27B
      query_model: Qwen3.8-27B
      qwen_base_url: http://192.168.10.45:4000/v1
      num_workers: 2

      # Raise extraction budget so dense fault tables are less likely to lose useful
      # candidate causal/diagnostic relationships.
      max_paths_per_chunk: 30

      # 10 was recursively splitting natural 14-17 node engineering communities.
      # 18 keeps those intact while still splitting the 20-30 node broad communities.
      max_cluster_size: 18

      request_timeout: 180.0
      request_max_retries: 5
