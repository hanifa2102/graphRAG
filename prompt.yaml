  Half_PSD:
    extraction: |
      -Role-
      You are a reliability engineer extracting one evidence-grounded Candidate Causal Graph for the Half-Height Platform Screen Door system, focused on the Door Control Unit (DCU). All entities and relationships belong to one graph that will later undergo community detection and causal validation.

      -Goal-
      Extract up to {max_knowledge_triplets} distinct, strongly supported entity-relation triplets from the supplied manual excerpt. Capture DCU system context, components and interfaces, commands and status signals, monitored or controlled parameters, operating states and events, explicitly stated faults, candidate causes, diagnostic observations, initialization, reset, replacement, tests, prerequisites, and procedural order.

      Prefer a smaller graph with strong textual support over a larger speculative graph.

      If the triplet limit prevents extracting everything, prioritize in this order:
      1. Explicit CAUSES and MAY_CAUSE relationships.
      2. Fault-to-symptom/outcome relationships.
      3. Diagnostic observations and INDICATES/DETECTS relationships.
      4. Operational responses, workarounds, corrective actions, and MITIGATES/RESPONDS_TO relationships.
      5. Control and monitoring relationships.
      6. Structural/interface relationships.
      7. Routine procedural relationships.

      -Allowed Entity Types-
      {entity_types}

      -Allowed Relationship Types-
      {relation_types}

      -Entity Rules-
      1. Return each entity's canonical name, one allowed type, and a concise description based only on the excerpt.
      2. Canonicalize names consistently across excerpts:
         - DCU -> Door Control Unit
         - PSCC -> Platform Screen Control Cabinet
         - SMT -> System Maintenance Tool
         - PSD System -> Platform Screen Door System
         - MCB -> Miniature Circuit Breaker
         - AUTO / AUTO Mode -> Auto Mode
         - NORMAL / NORMAL Mode -> Normal Mode
         - MANUAL OPEN / MANUAL OPEN Mode -> Manual Open Mode
         - MANUAL CLOSE / MANUAL CLOSE Mode -> Manual Close Mode
         Do not create a second entity merely because capitalization, abbreviation, or wording differs.
      3. Keep different concepts separate. Open Command is a SIGNAL while Door Open is a STATE. Doors Closed and Locked Status is a SIGNAL while Door Closed and Locked is a STATE. Motor Current is a PARAMETER while Motor Current Increase is a STATE. Door Speed is a PARAMETER while Door Speed Reduction is a STATE.
      4. Use FAULT only for an explicitly stated failure, malfunction, alarm, abnormal condition, or missing expected function. A reset, replacement, inspection, or test procedure alone is not evidence of a fault.
      5. Use PROCEDURE for a named maintenance/operational procedure that contains multiple steps. Use ACTION for a discrete intervention or individual step.
      6. Use EVENT for time-bounded operation, detection, response, initialization, or state transition.
      7. Use specific singular technical names. Do not create vague entities such as Equipment, Problem, Issue, Procedure, Status, Signal, Parameter, or System when a more specific name is available.
      8. Do not extract section, chapter, page, table, figure, step numbers, headings, warning labels, or document titles as entities.
      9. Every relationship endpoint MUST also appear in the returned entities list using exactly the same canonical name. Never create a relationship to an undeclared entity.

      -Relationship Rules-
      1. Preserve direction exactly. Every source and target must exactly match an entity name in the entities list.
      2. PART_OF expresses membership. CONNECTED_TO expresses an explicit interface. Neither implies causation.
      3. For information flow, use sender SENDS signal and receiver RECEIVES signal.
      4. MONITORS means observes or supervises. CONTROLS means regulates. Neither means CAUSES.
      5. CONFIGURES means an action explicitly sets or changes a mode, parameter, configuration, or component setting.
      6. HAS_STATE links a component/system to an explicitly associated state or mode.
      7. HAS_STEP links a named PROCEDURE to an ACTION that is explicitly one of its steps. Use PRECEDES between actions only when the source states their temporal/procedural order.
      8. ACTS_ON links an ACTION to the physical component/system it explicitly operates on.
      9. Use CAUSES only when the excerpt directly states causality or describes an unambiguous mechanism with clear direction.
      10. Use MAY_CAUSE when the source says 'could be caused by', 'possible cause', 'may cause', or otherwise presents the source as a candidate rather than a confirmed cause. Never upgrade MAY_CAUSE to CAUSES.
      11. Use INDICATES when an observation provides diagnostic evidence. Do not reverse cause and indicator.
      12. Use DETECTS when a component/system identifies a condition, state, event, or fault. Use TRIGGERS for an explicitly described controller response or state transition.
      13. RESPONDS_TO is for operational responses/workarounds to a symptom, fault, event, or abnormal state. A workaround does not repair the underlying root cause unless the source explicitly says so.
      14. Use MITIGATES only when the action explicitly repairs, reduces, resolves, or addresses the named fault/abnormal state itself.
      15. Use CLEARS when the source explicitly says a signal, report, indication, or abnormal condition is cleared/reset/removed.
      16. Use REQUIRES for explicit preconditions. PRECEDES does not imply CAUSES.
      17. Use TESTS when an action checks a component, function, signal, parameter, or state.
      18. Ignore instructions whose meaning depends entirely on an unseen image, schematic, graphical callout, or connector label. Extract independently understandable text from the same instruction.
      19. Remove duplicate entities and relationships. Reuse canonical DCU-centred names across excerpts. Do not force unsupported edges merely to connect the graph.

      -Critical Positive/Negative Examples-
      Example A - obstruction detection:
      Source meaning: obstruction is detected by monitoring speed reduction and increased motor current.
      GOOD entities: Door Speed Reduction [STATE], Motor Current Increase [STATE], Obstruction Detected [EVENT].
      GOOD edges: Door Speed Reduction INDICATES Obstruction Detected; Motor Current Increase INDICATES Obstruction Detected.
      BAD edges: Motor Current INDICATES Door Leaf; Door Speed CAUSES Obstruction.

      Example B - possible fault causes:
      Source meaning: 'One or more PSD do not open could be caused by Broken Tooth Belt or DCU/Motor Fault.'
      GOOD: Broken Tooth Belt MAY_CAUSE One or More PSDs Don't Open.
      GOOD: DCU and/or Motor Fault MAY_CAUSE One or More PSDs Don't Open.
      BAD: represent these as confirmed CAUSES when the manual only presents them as possibilities.

      Example C - workaround versus root cause:
      Source meaning: if Signalling System fails to give an Open Command, station staff use the ERM key to open the PSD.
      GOOD: Signalling System Failure MAY_CAUSE All PSD Don't Open.
      GOOD: Use ERM Key to Open PSD RESPONDS_TO All PSD Don't Open.
      BAD: Use ERM Key to Open PSD MITIGATES Signalling System Failure.

      Example D - maintenance procedure:
      Source meaning: Replace DCU contains steps such as power off, disconnect cables, remove/mount DCU, reconnect cables, and power on.
      GOOD: Replace DCU [PROCEDURE] HAS_STEP Power Off MCB [ACTION].
      GOOD: Power Off MCB PRECEDES Disconnect Cables when sequence is explicit.
      BAD: Replace DCU REQUIRES Disconnect Cables merely because disconnecting appears as a step.

      -Validation-
      Before returning the result, verify that:
      (a) every entity and relation uses an allowed label;
      (b) every relationship endpoint exists in the entity list;
      (c) canonical names are reused consistently;
      (d) direction is correct;
      (e) commands, statuses, states, parameters, events, faults, procedures, and actions remain distinct;
      (f) possible causes remain MAY_CAUSE rather than confirmed CAUSES;
      (g) procedural order is not represented as causality;
      (h) maintenance action/workaround is not treated as proof of root cause;
      (i) no external engineering knowledge or unsupported inference has been added.

      -Source Text-
      {text}

