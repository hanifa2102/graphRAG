active_ontology: Xelsis
ontologies:
  Xelsis:
    entity_types:
      DEVICE: The appliance being described, such as the Saeco Xelsis coffee machine.
      COMPONENT: A physical machine part or accessory, such as the brew group or AquaClean filter.
      CONTROL: A menu, icon, or physical control used to operate the machine.
      FEATURE: A named capability, such as BeanMaestro, HygieSteam, or the Maintenance Dashboard.
      SETTING: An adjustable parameter, such as grind setting, water hardness, or brewing temperature.
      RESOURCE: An ingredient, cleaning material, or tool used during an operation.
      DRINK: A prepared beverage, such as coffee, cappuccino, or hot water.
      CONDITION: A symptom, component state, or operating circumstance, such as watery coffee or a clogged filter.
      ACTION: An operation, maintenance procedure, or individual procedural step.
      DIAGNOSTIC_CASE: One troubleshooting entry linking a symptom to its specific possible cause and associated remedy; use a distinct descriptive name for each entry.
    relation_types:
      HAS_COMPONENT: A device or component contains a physical component.
      HAS_FEATURE: A device provides a named capability.
      HAS_SETTING: A device, component, or feature has an adjustable parameter.
      ACCESSED_VIA: An action, feature, or setting is accessed through a control.
      ACTS_ON: An action operates on a device or component.
      USES: An action or feature uses a resource or component.
      PRODUCES: An action produces a drink.
      HAS_STEP: A procedure includes an individual action step.
      PRECEDES: An action comes before another action within the same procedure.
      REQUIRES_CONDITION: An action requires a specified condition to hold.
      MAY_CAUSE: A condition can lead to another condition; this is a possible cause, not a confirmed diagnosis.
      PREVENTS: An action or feature prevents an undesirable condition as stated by the source.
      HAS_SYMPTOM: A diagnostic case has an observed symptom represented as a condition.
      HAS_POSSIBLE_CAUSE: A diagnostic case has a specific possible cause represented as a condition.
      HAS_REMEDY: A diagnostic case has an associated corrective action.

  AI news:
    entity_types:
      ORGANIZATION: A company, institution, or other organization involved in AI copyright or governance.
      PERSON: An individual mentioned in the source article.
      LEGISLATION: A law, bill, or legislative framework.
      LEGAL_CASE: A lawsuit or other legal proceeding.
      CONCEPT: An idea or topic such as copyright, fair use, or intellectual property.
      GOVERNMENT: A government or governmental authority.
      AI_SYSTEM: An AI model, product, or system.
    relation_types:
      FILED_AGAINST: The source filed a legal action against the target.
      DEFENDANT_IN: The source is a defendant in the target legal case.
      REGULATES: The source regulates the target.
      ADVOCATES_FOR: The source supports or advocates for the target.
      TRAINED_ON: The source AI system was trained on the target data or material.
      PART_OF: The source is part of the target.
      REFERENCES: The source references the target.
      OPPOSES: The source opposes the target.

  Half_PSD:
    entity_types:
      SYSTEM: A system, subsystem, controller platform, or functional assembly, such as the Platform Screen Door System, Doorway, Platform Screen Control Cabinet, System Maintenance Tool, or Signalling System.
      COMPONENT: A discrete physical, electrical, electronic, or electromechanical item, such as the Door Control Unit, drive motor, door leaf, locking block, limit switch, or circuit breaker.
      SIGNAL: A command, status, indication, alarm, report, or communicated data item, such as an Open Command, Enable Command, Doors Closed and Locked Status, or CAN data.
      PARAMETER: A measured, monitored, configured, or controlled quantity, such as motor current, door speed, door position, clamp force, or a delay.
      STATE: A persistent operating state, mode, configuration, or physical condition, such as DCU Powered Off, DCU Initialized, Manual Mode, Door Closed and Locked, Physical Obstruction Present, Motor Current Increase, or Door Speed Reduction.
      EVENT: A time-bounded operational occurrence, detection, response, or state transition, such as Obstruction Detected, Door Movement Stopped, Door Reclosing, or DCU Initialization.
      FAULT: An explicitly stated failure, malfunction, alarm, abnormal condition, or missing expected function. A reset or replacement procedure alone is not evidence of a fault.
      PROCEDURE: A named operational or maintenance procedure composed of individual action steps, such as Replace DCU, Reset DCU, or DCU Initialization Procedure.
      ACTION: A discrete operational or maintenance intervention or procedure step, such as Power Off MCB, Disconnect Cables, Inspect Connection, Restore Power, or Perform Functional Test.

    relation_types:
      PART_OF: The source component or subsystem belongs to the target system or assembly.
      CONNECTED_TO: The source has an explicitly described physical, electrical, serial, hardwired, or data-bus connection to the target.
      SENDS: The source originates or transmits the target signal or communicated data item.
      RECEIVES: The source receives the target signal or communicated data item.
      MONITORS: The source component or system observes, measures, checks, or supervises the target signal, parameter, state, event, or fault.
      CONTROLS: The source regulates the target component, parameter, state, or event; this does not by itself mean causation.
      CONFIGURES: The source action or procedure explicitly sets or changes the target mode, configuration, parameter, or component setting.
      HAS_STATE: The source component or system has the target explicitly described state, mode, configuration, or physical condition.
      HAS_STEP: The source procedure contains the target action as one of its stated steps.
      ACTS_ON: The source action explicitly operates on, manipulates, removes, installs, powers, opens, closes, or otherwise acts on the target component or system.
      CAUSES: The source directly produces the target, with explicit or unambiguous causal support in the source text.
      MAY_CAUSE: The source is explicitly stated as a possible, potential, conditional, or candidate cause of the target; do not upgrade this to confirmed CAUSES.
      INDICATES: The source observation, signal, parameter, or state provides diagnostic evidence of the target; indication is not causation.
      DETECTS: The source component or system identifies the target condition, state, event, or fault.
      TRIGGERS: The source initiates the target controller response, operational event, state change, or action.
      RESPONDS_TO: The source action or procedure is an operational response or workaround for the target fault, symptom, event, or abnormal state; it does not imply that the action repairs the underlying cause.
      PREVENTS: The source explicitly stops the target state or event from occurring or being achieved.
      REQUIRES: The source action, event, or procedure explicitly depends on the target as a precondition.
      PRECEDES: The source occurs before the target in an explicitly stated temporal or procedural sequence; sequence is not causation.
      MITIGATES: The source action explicitly reduces, clears, resolves, repairs, or addresses the target fault or abnormal state itself.
      CLEARS: The source state, event, or action explicitly clears, resets, or removes the target signal, report, indication, or abnormal condition.
      TESTS: The source action checks the operation, function, state, signal, parameter, component, or system represented by the target.
